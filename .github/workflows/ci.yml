name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master, feat/memberry-phase2-integration]
  pull_request:
    branches: [main, master]

jobs:
  # Fast job: type-check + unit tests (no infrastructure needed)
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          # The deterministic lab verifies immutable Git blobs from the protected
          # pre-lab commit, so a depth-1 PR checkout is insufficient.
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Validate MemBerry agent guidance
        run: npm run validate:memberry-guidance

      - name: Run unit tests
        run: npm test
        env:
          REDIS_URL: ""
          NEO4J_URI: ""

      - name: Run full evaluation-lab unit tests
        run: npm run bench:lab:test

      - name: Type-check evaluation lab
        run: npm run bench:lab:typecheck

      # Required deterministic lab gate: validates the pinned registries and immutable
      # baseline, runs the legacy quality control, then compares the proxy candidate
      # against the independent control over physically separated dev/holdout oracles.
      # It is deliberately offline; external datasets and live adapters run separately.
      - name: Evaluation-lab deterministic gate
        run: npm run bench:lab:ci
        env:
          REDIS_URL: ""
          NEO4J_URI: ""

  # Full job: integration tests with Redis + Neo4j service containers
  integration:
    runs-on: ubuntu-latest
    needs: unit

    services:
      # These tags select compatible service lines; RET-001D never treats them as
      # evidence identity. The inspection step below records the actual immutable
      # container and image IDs plus versions observed from each live service.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5-community
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize phase-2 hosted evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "${RUNNER_TEMP}/memberry-admission-candidate-live" \
            "${RUNNER_TEMP}/memberry-retrieval-scope-live" \
            "${RUNNER_TEMP}/memberry-retrieval-planner-live" \
            "${RUNNER_TEMP}/memberry-candidate-channel-live" \
            "${RUNNER_TEMP}/memberry-admission-live-composition" \
            "${RUNNER_TEMP}/memberry-retrieval-trace-live-conformance"
          chmod 0700 \
            "${RUNNER_TEMP}/memberry-admission-candidate-live" \
            "${RUNNER_TEMP}/memberry-retrieval-scope-live" \
            "${RUNNER_TEMP}/memberry-retrieval-planner-live" \
            "${RUNNER_TEMP}/memberry-candidate-channel-live" \
            "${RUNNER_TEMP}/memberry-admission-live-composition" \
            "${RUNNER_TEMP}/memberry-retrieval-trace-live-conformance"
          printf '{"repository":"%s","sha":"%s","run_id":"%s","run_attempt":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            >"${RUNNER_TEMP}/memberry-admission-candidate-live/workflow.json"
          cp "${RUNNER_TEMP}/memberry-admission-candidate-live/workflow.json" \
            "${RUNNER_TEMP}/memberry-retrieval-scope-live/workflow.json"
          cp "${RUNNER_TEMP}/memberry-admission-candidate-live/workflow.json" \
            "${RUNNER_TEMP}/memberry-retrieval-planner-live/workflow.json"
          cp "${RUNNER_TEMP}/memberry-admission-candidate-live/workflow.json" \
            "${RUNNER_TEMP}/memberry-candidate-channel-live/workflow.json"
          cp "${RUNNER_TEMP}/memberry-admission-candidate-live/workflow.json" \
            "${RUNNER_TEMP}/memberry-admission-live-composition/workflow.json"
          cp "${RUNNER_TEMP}/memberry-admission-candidate-live/workflow.json" \
            "${RUNNER_TEMP}/memberry-retrieval-trace-live-conformance/workflow.json"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate default-off planner Compose pass-through
        shell: bash
        run: |
          set -euo pipefail
          check_planner_value() {
            local input="$1"
            local expected="$2"
            local rendered
            if [[ "$input" == '__UNSET__' ]]; then
              rendered="$(env -u MEMBERRY_QUERY_PLANNER_V1 docker compose --env-file /dev/null --profile app --profile wiki config --format json)"
            else
              rendered="$(MEMBERRY_QUERY_PLANNER_V1="$input" docker compose --env-file /dev/null --profile app --profile wiki config --format json)"
            fi
            COMPOSE_JSON="$rendered" EXPECTED="$expected" node <<'NODE'
          const config = JSON.parse(process.env.COMPOSE_JSON);
          const expected = process.env.EXPECTED;
          const mcpValue = config?.services?.mcp?.environment?.MEMBERRY_QUERY_PLANNER_V1;
          const wikiEnvironment = config?.services?.wiki?.environment ?? {};
          if (typeof mcpValue !== 'string' || mcpValue !== expected) process.exit(1);
          if (Object.hasOwn(wikiEnvironment, 'MEMBERRY_QUERY_PLANNER_V1')) process.exit(1);
          NODE
          }
          check_planner_value '__UNSET__' ''
          check_planner_value '' ''
          check_planner_value '1' '1'
          check_planner_value '01' '01'
          check_planner_value '1.0' '1.0'
          check_planner_value 'true' 'true'
          check_planner_value '1 ' '1 '
          check_candidate_value() {
            local input="$1"
            local expected="$2"
            local rendered
            if [[ "$input" == '__UNSET__' ]]; then
              rendered="$(env -u MEMBERRY_CANDIDATE_CHANNEL_V1 docker compose --env-file /dev/null --profile app --profile wiki config --format json)"
            else
              rendered="$(MEMBERRY_CANDIDATE_CHANNEL_V1="$input" docker compose --env-file /dev/null --profile app --profile wiki config --format json)"
            fi
            COMPOSE_JSON="$rendered" EXPECTED="$expected" node <<'NODE'
          const config = JSON.parse(process.env.COMPOSE_JSON);
          const expected = process.env.EXPECTED;
          const mcpValue = config?.services?.mcp?.environment?.MEMBERRY_CANDIDATE_CHANNEL_V1;
          const wikiEnvironment = config?.services?.wiki?.environment ?? {};
          if (typeof mcpValue !== 'string' || mcpValue !== expected) process.exit(1);
          if (Object.hasOwn(wikiEnvironment, 'MEMBERRY_CANDIDATE_CHANNEL_V1')) process.exit(1);
          NODE
          }
          check_candidate_value '__UNSET__' ''
          check_candidate_value '' ''
          check_candidate_value '1' '1'
          check_candidate_value '01' '01'
          check_candidate_value '1.0' '1.0'
          check_candidate_value 'true' 'true'
          check_candidate_value '1 ' '1 '

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Pre-pull exact approved admission candidate base image
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/memberry-admission-candidate-live"
          approved_base='node@sha256:7eb2c0c4b8cf6fd761f0e6a7fed8d3b8ad59186848f0eee59744e546f1b6a3e9'
          docker pull --platform linux/amd64 "$approved_base" 2>&1 | tee "$evidence_dir/base-image-pull.log"
          repo_digests="$(docker image inspect --format='{{json .RepoDigests}}' "$approved_base")"
          local_image_sha256="$(docker image inspect --format='{{.Id}}' "$approved_base")"
          [[ "$local_image_sha256" =~ ^sha256:[0-9a-f]{64}$ ]]
          node -e '
            const digests = JSON.parse(process.argv[1]);
            if (!Array.isArray(digests) || !digests.includes(process.argv[2])) process.exit(1);
          ' "$repo_digests" "$approved_base"
          printf '{"approvedBaseImage":"%s","localImageSha256":"%s","repoDigests":%s}\n' \
            "$approved_base" "$local_image_sha256" "$repo_digests" \
            >"$evidence_dir/base-image.json"

      - name: Admission candidate live Docker evidence
        shell: bash
        env:
          MEMBERRY_ADMISSION_CANDIDATE_LIVE_EVIDENCE_PATH: ${{ runner.temp }}/memberry-admission-candidate-live/evidence.json
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/memberry-admission-candidate-live"
          npm run bench:lab:admission:candidate:live 2>&1 | tee "$evidence_dir/run.log"

      - name: Upload admission candidate live Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memberry-admission-candidate-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memberry-admission-candidate-live
          if-no-files-found: error
          retention-days: 14

      - name: Run all tests (unit + integration)
        run: npm test
        env:
          REDIS_URL: redis://localhost:6379
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          # Enables the fail-closed, disposable AdmissionObservation concurrency,
          # rollback, corruption, isolation, and cleanup evidence suite.
          MEMBERRY_NEO4J_INTEGRATION: "1"

      - name: Scoped retrieval resolver required live evidence
        if: always()
        shell: bash
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          MEMBERRY_RET002B_LIVE_MODE: required
          MEMBERRY_RET002B_DISPOSABLE_OPT_IN: "1"
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/memberry-retrieval-scope-live"
          neo4j_container_id="${{ job.services.neo4j.id }}"
          neo4j_image_sha256="$(docker inspect --format='{{.Image}}' "$neo4j_container_id")"
          [[ "$neo4j_container_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$neo4j_image_sha256" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '{"neo4jContainerId":"%s","neo4jImageSha256":"%s","mode":"required","disposable":true}\n' \
            "$neo4j_container_id" "$neo4j_image_sha256" >"$evidence_dir/service.json"
          npm run bench:lab:retrieval:scope:live 2>&1 | sed -E \
            -e 's/testpassword/[REDACTED]/g' \
            | tee "$evidence_dir/run.log"

      - name: Upload scoped retrieval resolver live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memberry-retrieval-scope-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memberry-retrieval-scope-live
          if-no-files-found: error
          retention-days: 14

      - name: Authenticated retrieval planner required live evidence
        if: always()
        shell: bash
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          MEMBERRY_RET002C2_LIVE_MODE: required
          MEMBERRY_RET002C2_DISPOSABLE_OPT_IN: "1"
          MEMBERRY_RET002C2_EVIDENCE_PATH: ${{ runner.temp }}/memberry-retrieval-planner-live/evidence.json
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/memberry-retrieval-planner-live"
          neo4j_container_id="${{ job.services.neo4j.id }}"
          neo4j_image_sha256="$(docker inspect --format='{{.Image}}' "$neo4j_container_id")"
          [[ "$neo4j_container_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$neo4j_image_sha256" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '{"neo4jContainerId":"%s","neo4jImageSha256":"%s","mode":"required","disposable":true}\n' \
            "$neo4j_container_id" "$neo4j_image_sha256" >"$evidence_dir/service.json"
          npm run bench:lab:retrieval:planner:live 2>&1 | sed -E \
            -e 's/testpassword/[REDACTED]/g' \
            | tee "$evidence_dir/run.log"

      - name: Upload authenticated retrieval planner live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memberry-retrieval-planner-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memberry-retrieval-planner-live
          if-no-files-found: error
          retention-days: 14

      - name: Candidate-channel runtime required live evidence
        if: always()
        shell: bash
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          MEMBERRY_RET003B_LIVE_MODE: required
          MEMBERRY_RET003B_DISPOSABLE_OPT_IN: "1"
          MEMBERRY_RET003B_EVIDENCE_PATH: ${{ runner.temp }}/memberry-candidate-channel-live/evidence.json
          MEMBERRY_RET003B_DEDICATED_NEO4J_URI: bolt://127.0.0.1:17687
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/memberry-candidate-channel-live"
          neo4j_container_id="${{ job.services.neo4j.id }}"
          neo4j_image_sha256="$(docker inspect --format='{{.Image}}' "$neo4j_container_id")"
          [[ "$neo4j_container_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$neo4j_image_sha256" =~ ^sha256:[0-9a-f]{64}$ ]]
          dedicated_name="memberry-ret003b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dedicated_id="$(docker run -d --name "$dedicated_name" -p 127.0.0.1:17687:7687 \
            -e NEO4J_AUTH=neo4j/testpassword "$neo4j_image_sha256")"
          trap 'docker rm -f "$dedicated_name" >/dev/null 2>&1 || true' EXIT
          [[ "$dedicated_id" =~ ^[0-9a-f]{64}$ ]]
          for attempt in $(seq 1 30); do
            if docker exec "$dedicated_name" cypher-shell -u neo4j -p testpassword 'RETURN 1' >/dev/null 2>&1; then break; fi
            [[ "$attempt" -lt 30 ]] || exit 1
            sleep 2
          done
          dedicated_image_sha256="$(docker inspect --format='{{.Image}}' "$dedicated_id")"
          [[ "$dedicated_image_sha256" == "$neo4j_image_sha256" ]]
          printf '{"neo4jContainerId":"%s","neo4jImageSha256":"%s","dedicatedNeo4jContainerId":"%s","dedicatedNeo4jImageSha256":"%s","mode":"required","disposable":true}\n' \
            "$neo4j_container_id" "$neo4j_image_sha256" "$dedicated_id" "$dedicated_image_sha256" >"$evidence_dir/service.json"
          npm run bench:lab:retrieval:candidate:live 2>&1 | sed -E \
            -e 's/testpassword/[REDACTED]/g' \
            | tee "$evidence_dir/run.log"
          test -f "$evidence_dir/evidence.json"

      - name: Upload candidate-channel runtime live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memberry-candidate-channel-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memberry-candidate-channel-live
          if-no-files-found: error
          retention-days: 14

      # Production-path proof for the lab adapter. This starts the real MCP
      # composition root against disposable service containers and writes then
      # exact-verifies one uniquely scoped synthetic fixture under the default
      # test tenant. Scored live evaluation remains a separate berry_load path.
      - name: Evaluation-lab live MCP smoke
        shell: bash
        env:
          REDIS_URL: redis://localhost:6379
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          MEMBERRY_API_TOKEN: lab-test-token
          MEMBERRY_CONSOLIDATION_ENABLED: "false"
          MEMBERRY_WIKI_AUTOREFRESH: "false"
          MEMBERRY_LAB_TENANT_ID: default
          MEMBERRY_LAB_API_TOKEN: lab-test-token
          MEMBERRY_LAB_MCP_URL: http://127.0.0.1:3101
          MEMBERRY_LAB_ALLOW_WRITES: "true"
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/memberry-live-evidence"
          server_log="${RUNNER_TEMP}/memberry-mcp.log"
          mkdir -p "$evidence_dir"
          sanitize() {
            sed -E \
              -e 's/(Bearer )[A-Za-z0-9._~+\/-]+/\1[REDACTED]/g' \
              -e 's/lab-test-token/[REDACTED]/g' \
              -e 's/testpassword/[REDACTED]/g'
          }
          npm start >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3101/healthz >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              sanitize <"$server_log" | tee "$evidence_dir/server.log" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3101/healthz >/dev/null || {
            sanitize <"$server_log" | tee "$evidence_dir/server.log" >&2
            exit 1
          }
          npm run bench:lab:live 2>&1 | sanitize | tee "$evidence_dir/smoke.log"

      - name: Sanitize live MCP server evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/memberry-live-evidence"
          server_log="${RUNNER_TEMP}/memberry-mcp.log"
          mkdir -p "$evidence_dir"
          if [[ -f "$server_log" ]]; then
            sed -E \
              -e 's/(Bearer )[A-Za-z0-9._~+\/-]+/\1[REDACTED]/g' \
              -e 's/lab-test-token/[REDACTED]/g' \
              -e 's/testpassword/[REDACTED]/g' \
              "$server_log" >"$evidence_dir/server.log"
          fi
          printf '{"repository":"%s","sha":"%s","run_id":"%s","run_attempt":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            >"$evidence_dir/metadata.json"

      - name: Upload live evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memberry-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memberry-live-evidence
          if-no-files-found: error
          retention-days: 14

      # MEM-001D2 is a separately labeled composition-root proof. The runner
      # starts the real MCP twice (default-off and enabled), enters only through
      # Streamable HTTP, uses Neo4j as a scorer-side oracle, and deletes only its
      # exact synthetic scopes. GitHub owns teardown of these disposable services.
      - name: Admission live composition evidence
        shell: bash
        env:
          MEMBERRY_ADMISSION_LIVE_ALLOW_WRITES: "true"
          MEMBERRY_ADMISSION_LIVE_DISPOSABLE: "true"
          MEMBERRY_ADMISSION_LIVE_API_TOKEN: admission-live-token
          MEMBERRY_ADMISSION_LIVE_MCP_URL: http://127.0.0.1:3311
          MEMBERRY_ADMISSION_LIVE_REDIS_URL: redis://127.0.0.1:6379
          MEMBERRY_ADMISSION_LIVE_NEO4J_URI: bolt://127.0.0.1:7687
          MEMBERRY_ADMISSION_LIVE_NEO4J_USER: neo4j
          MEMBERRY_ADMISSION_LIVE_NEO4J_PASSWORD: testpassword
          MEMBERRY_ADMISSION_LIVE_EVIDENCE_PATH: ${{ runner.temp }}/memberry-admission-live-composition/evidence.json
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/memberry-admission-live-composition"
          mkdir -p "$evidence_dir"
          npm run bench:lab:admission:live 2>&1 | sed -E \
            -e 's/(Bearer )[A-Za-z0-9._~+\/-]+/\1[REDACTED]/g' \
            -e 's/admission-live-token/[REDACTED]/g' \
            -e 's/testpassword/[REDACTED]/g' \
            | tee "$evidence_dir/run.log"

      - name: Upload admission live composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memberry-admission-live-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memberry-admission-live-composition
          if-no-files-found: error
          retention-days: 14

      # RET-001D exercises only the already opt-in retrieval trace. The runner
      # owns exact synthetic fixtures, starts the real composition root in
      # default and named-tenant modes, and removes its graph/Redis residue.
      - name: Capture exact service container identities
        shell: bash
        run: |
          set -euo pipefail
          redis_container_id="${{ job.services.redis.id }}"
          neo4j_container_id="${{ job.services.neo4j.id }}"
          [[ "$redis_container_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$neo4j_container_id" =~ ^[0-9a-f]{64}$ ]]
          redis_image_id="$(docker inspect --format='{{.Image}}' "$redis_container_id")"
          neo4j_image_id="$(docker inspect --format='{{.Image}}' "$neo4j_container_id")"
          [[ "$redis_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$neo4j_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "MEMBERRY_TRACE_LIVE_REDIS_CONTAINER_ID=$redis_container_id"
            echo "MEMBERRY_TRACE_LIVE_REDIS_IMAGE_ID=$redis_image_id"
            echo "MEMBERRY_TRACE_LIVE_NEO4J_CONTAINER_ID=$neo4j_container_id"
            echo "MEMBERRY_TRACE_LIVE_NEO4J_IMAGE_ID=$neo4j_image_id"
          } >> "$GITHUB_ENV"

      - name: Retrieval trace live conformance evidence
        shell: bash
        env:
          MEMBERRY_TRACE_LIVE_DISPOSABLE: "true"
          MEMBERRY_TRACE_LIVE_DEFAULT_TOKEN: trace-default-token
          MEMBERRY_TRACE_LIVE_NAMED_TOKEN: trace-named-token
          MEMBERRY_TRACE_LIVE_MCP_URL: http://127.0.0.1:3411
          MEMBERRY_TRACE_LIVE_REDIS_URL: redis://127.0.0.1:6379
          MEMBERRY_TRACE_LIVE_NEO4J_URI: bolt://127.0.0.1:7687
          MEMBERRY_TRACE_LIVE_NEO4J_USER: neo4j
          MEMBERRY_TRACE_LIVE_NEO4J_PASSWORD: testpassword
          MEMBERRY_TRACE_LIVE_EVIDENCE_PATH: ${{ runner.temp }}/memberry-retrieval-trace-live-conformance/evidence.json
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/memberry-retrieval-trace-live-conformance"
          mkdir -p "$evidence_dir"
          npm run bench:lab:retrieval-trace:live 2>&1 | sed -E \
            -e 's/(Bearer )[A-Za-z0-9._~+\/-]+/\1[REDACTED]/g' \
            -e 's/trace-default-token/[REDACTED]/g' \
            -e 's/trace-named-token/[REDACTED]/g' \
            -e 's/testpassword/[REDACTED]/g' \
            | tee "$evidence_dir/run.log"

      - name: Upload retrieval trace live conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memberry-retrieval-trace-live-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memberry-retrieval-trace-live-conformance
          if-no-files-found: error
          retention-days: 14
